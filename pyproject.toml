[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "segresnet-mlx"
version = "0.3.2"
description = "Native MLX SegResNet with NumPy sliding-window logit inference"
readme = "README.md"
requires-python = ">=3.13,<3.15"
classifiers = ["Operating System :: MacOS :: MacOS X"]
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Joseph Sandoval" }, { name = "Alfredo Sandoval Jr." }]
dependencies = [
  "medmlx-core==0.2.5",
  "nibabel>=5.3,<6",
  "numpy>=2.0,<3",
]

[project.entry-points."medmlx.models"]
segresnet-brats = "segresnet_mlx.medmlx:BRATS_MODEL"
segresnet-renal-cect = "segresnet_mlx.medmlx:RENAL_CECT_MODEL"

[project.urls]
Homepage = "https://medmlx.org"
Repository = "https://github.com/MedMLX/segresnet-mlx"
Weights = "https://huggingface.co/MedMLX/segresnet-renal-cect-mlx"

[project.optional-dependencies]
dev = [
  "pyright==1.1.414",
  "pytorch-ignite>=0.4.11,<0.6",
  "hypothesis>=6,<7",
  "monai==1.6.1", # Pinned upstream reference tests and generation only.
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "torch>=2.6,<3",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/segresnet_mlx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = ["mlx: native MLX execution requiring Apple Silicon Metal"]

[tool.uv]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1", ]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
extend-select = ["TID251", "TID252", "ANN401"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["scripts","src","tests"]
extraPaths = ["src", "scripts", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}
"typing_extensions.Any" = {msg = "Use a precise type and parse untyped values at the boundary."}

[tool.hatch.build.targets.sdist]
only-include = [
  "src/segresnet_mlx",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
]
